[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-backend"
version = "1.0.0"
description = "Nimbus Backend API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-json-logger>=2.0.7",
    "Authlib>=1.3.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.5",
    "black>=24.3.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
    "Faker>=25.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.14"
strict = true
